[package]
name = "recemotion"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "recemotion-cli"
path = "src/main.rs"
required-features = ["cli"]   # --lib時にtokioごと除外される

[dependencies]
jni = "0.21"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
serde_json = "1.0"
lazy_static = "1.4"
chrono = "0.4"
android_logger = "0.13"
log = "0.4"
tokio = { version = "1.0", features = ["full"], optional = true }

[features]
cli = ["tokio"]
